[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vaakmitra-speech-intelligence"
version = "0.1.0"
description = "Offline Tamil phoneme acoustic inference and pronunciation scoring"
readme = "../README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary - academic project" }
authors = [{ name = "VaakMitra Team 96" }]
dependencies = [
  "numpy>=1.26,<2",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]
model = [
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
  "psutil>=5.9,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vaakmitra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vaakmitra"]

[[tool.mypy.overrides]]
module = [
  "numpy",
  "numpy.*",
  "onnx",
  "onnx.*",
  "onnxruntime",
  "onnxruntime.*",
  "torch",
  "torch.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["modeling.distillation.teacher_features"]
follow_imports = "skip"

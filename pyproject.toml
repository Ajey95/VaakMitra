[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asd-edge-st-backend"
version = "2.0.0"
description = "ASD-Edge-ST 2.0 — Member 3 backend: session orchestration, adaptive logic, data, sync, security"
requires-python = ">=3.11"
dependencies = [
    # API framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    # Encryption (SQLCipher binding)
    "sqlcipher3-binary>=0.5.2; sys_platform != 'win32'",
    # HTTP client for sync
    "httpx>=0.27.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",   # AsyncClient for API tests
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -v"

[tool.setuptools.packages.find]
where = ["."]
include = ["asd_backend*"]
